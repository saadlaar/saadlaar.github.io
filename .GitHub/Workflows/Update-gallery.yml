
name: Automatically Update Gallery

on:
  push:
    branches:
      - main
    paths:
      - 'assets/images/gallery/**'
      - '.github/workflows/update-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Gallery.json
        run: |
          python3 <<'PY'
          import os
          import json

          gallery_folder = "assets/images/gallery"
          output_file = "Gallery.json"

          extensions = (
              ".jpg", ".jpeg", ".png",
              ".webp", ".gif", ".avif"
          )

          gallery = []

          if os.path.exists(gallery_folder):
              files = sorted(os.listdir(gallery_folder))

              for filename in files:
                  if filename.lower().endswith(extensions):
                      image_path = os.path.join(
                          gallery_folder, filename
                      ).replace("\\", "/")

                      title = os.path.splitext(filename)[0]
                      title = title.replace("-", " ").replace("_", " ").title()

                      gallery.append({
                          "id": len(gallery) + 1,
                          "title": title,
                          "image": image_path,
                          "category": "Personal",
                          "description": title
                      })

          data = {
              "gallery": gallery
          }

          with open(output_file, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print(f"Gallery updated with {len(gallery)} images.")
          PY

      - name: Commit updated gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Gallery.json

          if ! git diff --cached --quiet; then
            git commit -m "Automatically update Gallery.json"
            git push
          else
            echo "Gallery.json is already up to date."
          fi
