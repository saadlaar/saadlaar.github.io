
name: Update Photo Gallery

on:
  push:
    paths:
      - 'assets/images/gallery/**'
      - 'scripts/generate_gallery.py'
      - '.github/workflows/update-gallery.yml'

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate gallery
        run: python scripts/generate_gallery.py

      - name: Save updated gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gallery.json

          if ! git diff --cached --quiet; then
            git commit -m "Automatically update photo gallery"
            git push
          fi
